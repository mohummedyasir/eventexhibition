name: Deploy to GitHub Pages

# Builds the static site and deploys it to GitHub Pages on every push to the
# default branch. Enable Pages once: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build site
        run: node scripts/build.js
        env:
          # Set your production domain here (or a repo variable SITE_URL).
          SITE_URL: ${{ vars.SITE_URL || 'https://gulfeventsjobs.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
